# LibreSeal — self-hosted deployment built from this repository's source.
#
# Quick start:
#   ./scripts/libreseal-init.sh          # writes .env with random secrets
#   docker compose up -d --build
#
# Images are built locally (no images are pulled from Phase). See README.md.

x-backend-env: &backend-env
  OAUTH_REDIRECT_URI: "${PUBLIC_URL}"
  ALLOWED_HOSTS: "${HOST},backend"
  ALLOWED_ORIGINS: "${PUBLIC_URL}"
  SESSION_COOKIE_DOMAIN: "${HOST}"
  APP_HOST: "self"

services:
  nginx:
    container_name: libreseal-nginx
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    image: libreseal/nginx:local
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      NGINX_REAL_IP_FROM: "${NGINX_REAL_IP_FROM:-}"
      NGINX_REAL_IP_HEADER: "${NGINX_REAL_IP_HEADER:-X-Forwarded-For}"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - libreseal-net

  frontend:
    container_name: libreseal-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: libreseal/frontend:local
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env
    environment:
      NEXTAUTH_URL: "${PUBLIC_URL}"
      BACKEND_API_BASE: "http://backend:8000"
      NEXT_PUBLIC_BACKEND_API_BASE: "${PUBLIC_URL}/service"
      APP_HOST: "self"
    networks:
      - libreseal-net

  migrations:
    container_name: libreseal-migrations
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: libreseal/backend:local
    command: python manage.py migrate
    env_file: .env
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - libreseal-net

  backend:
    container_name: libreseal-backend
    image: libreseal/backend:local
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    environment:
      <<: *backend-env
      EXTERNAL_MIGRATION: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Host: backend", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - libreseal-net

  worker:
    container_name: libreseal-worker
    image: libreseal/backend:local
    restart: unless-stopped
    command: python manage.py rqworker default
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    environment:
      <<: *backend-env
    networks:
      - libreseal-net

  postgres:
    container_name: libreseal-postgres
    image: postgres:15.4-alpine3.17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - libreseal-postgres-data:/var/lib/postgresql/data
    networks:
      - libreseal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: libreseal-redis
    image: redis:alpine3.19
    restart: unless-stopped
    networks:
      - libreseal-net

volumes:
  libreseal-postgres-data:
    name: libreseal-postgres-data

networks:
  libreseal-net:
