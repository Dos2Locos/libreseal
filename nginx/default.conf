server {
    listen 80;
    listen 443 ssl;
    http2 on;
    # Remove Nginx version from response headers
    server_tokens off;

    # TLS config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+AESGCM:EECDH+CHACHA20; # Enforce strong ciphers, might break older clients. Adjust as needed.
    ssl_prefer_server_ciphers on;

    # TLS certificates
    # Self-signed. Adjust as needed.
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # Real client IP behind another reverse proxy: generated from
    # NGINX_REAL_IP_FROM / NGINX_REAL_IP_HEADER (see nginx/real-ip.sh).
    # $remote_addr below is then the real client, not the outer proxy.
    include /etc/nginx/real-ip.conf;
    
    # Route API traffic to backend - https://example.com/service/ -> http://backend:8000/
    location /service/ {
        rewrite ^/service/(.*) /$1 break;

        # Overwrite (never append) client-supplied forwarding headers.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;

        proxy_pass http://backend:8000;
        proxy_redirect off;

        proxy_cookie_path / "/; HttpOnly; SameSite=strict";

        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
        proxy_busy_buffers_size 128k;
    }
    
    # Route traffic to frontend - https://example.com/ -> http://frontend:3000/
    location / {
        include /etc/nginx/mime.types;

        # Overwrite (never append) client-supplied forwarding headers.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_pass http://frontend:3000;
        proxy_redirect off;

        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
        proxy_busy_buffers_size 128k;
    }
}
