name: LibreSeal Release

# Publishes a LibreSeal server release when a maintainer pushes a vX.Y.Z tag
# (or vX.Y.Z-rc.N) that points at a commit on main and matches
# backend/version.txt. Runs the full CI first, then builds and pushes the
# images to ghcr.io/dos2locos for linux/amd64 and linux/arm64, signs them with
# cosign (keyless, this workflow's OIDC identity), and opens a draft GitHub
# release with the deployment bundle. A maintainer publishes the draft.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/dos2locos

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag format, commit on main and declared version
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::tag $TAG is not vX.Y.Z or vX.Y.Z-rc.N"; exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG points at $GITHUB_SHA, which is not on main"; exit 1
          fi
          declared="$(tr -d '[:space:]' < backend/version.txt)"
          if [ "$TAG" != "$declared" ]; then
            echo "::error::tag $TAG does not match backend/version.txt ($declared)"; exit 1
          fi
          scripts/check-libreseal-guard.sh
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-rc.*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  ci:
    needs: verify
    uses: ./.github/workflows/main.yml

  build:
    needs: [verify, ci]
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [backend, frontend, nginx]
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build context
        id: ctx
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          case "$IMAGE" in
            backend) echo "context=./backend" >> "$GITHUB_OUTPUT"; echo "file=./backend/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            frontend) echo "context=./frontend" >> "$GITHUB_OUTPUT"; echo "file=./frontend/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            nginx) echo "context=." >> "$GITHUB_OUTPUT"; echo "file=./nginx/Dockerfile" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.file }}
          build-contexts: repo=.
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            LIBRESEAL_VERSION=${{ needs.verify.outputs.version }}
            LIBRESEAL_REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/libreseal-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        image: [backend, frontend, nginx]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Create multi-platform index and sign it
        env:
          NAME: ${{ env.REGISTRY }}/libreseal-${{ matrix.image }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          tags=(-t "$NAME:$VERSION")
          if [ "$PRERELEASE" != "true" ]; then tags+=(-t "$NAME:latest"); fi
          sources=()
          for d in "$RUNNER_TEMP"/digests/*; do sources+=("$NAME@sha256:$(basename "$d")"); done
          [ "${#sources[@]}" -eq 2 ] || { echo "::error::expected 2 platform digests, got ${#sources[@]}"; exit 1; }
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$NAME:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          docker buildx imagetools inspect "$NAME:$VERSION"
          cosign sign --yes "$NAME@$digest"

  release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deployment bundle and draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          scripts/make-deploy-bundle.sh "$VERSION" dist
          (cd dist && sha256sum -- *.tar.gz > checksums.txt && cat checksums.txt)
          flags=(--draft --verify-tag --generate-notes --title "LibreSeal $TAG")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" dist/*.tar.gz dist/checksums.txt
