name: LibreSeal CI

# Tests and builds only. Publishing images or releases is intentionally not
# configured yet (separate change); nothing is pushed to any registry.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: LibreSeal invariants (no ee/, no billing or telemetry deps)
        run: scripts/check-libreseal-guard.sh
      - name: Deployment script tests
        run: scripts/tests/test-libreseal-init.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt -c constraints.txt
          pip install -r dev-requirements.txt
      - name: Run tests
        working-directory: backend
        run: pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit -p .
      - name: Run tests
        working-directory: frontend
        run: yarn test
      - name: Run lint
        working-directory: frontend
        run: yarn lint

  compose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images from source
        run: |
          scripts/libreseal-init.sh
          docker compose build
